<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Car Viewer</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #888;
    }

    canvas {
      display: block;
    }

    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: white;
      padding: 10px;
      border-radius: 10px;
      font-family: Arial;
    }
  </style>
</head>
<body>

<body>

<input
  type="file"
  id="textureUpload"
  accept="image/png, image/jpeg"
  style="
    position:absolute;
    top:10px;
    left:10px;
    z-index:10;
    background:white;
    padding:10px;
    border-radius:10px;
  "
/>

<div id="info" style="top:70px;">
  Drag mouse to rotate camera
</div>

<script type="importmap">
{
  "imports": {
    "three": "./build/three.module.js"
  }
}
</script>
<script type="module">

import * as THREE from 'three';

import { OrbitControls } from './jsm/controls/OrbitControls.js';

import { GLTFLoader } from './jsm/loaders/GLTFLoader.js';



const scene = new THREE.Scene();

scene.background = new THREE.Color(0xa0a0a0);



const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(0, 2, 5);



const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);

document.body.appendChild(renderer.domElement);



const controls = new OrbitControls(camera, renderer.domElement);

controls.target.set(0, 1, 0);

controls.update();



const ambientLight = new THREE.AmbientLight(0xffffff, 2);

scene.add(ambientLight);



const directionalLight = new THREE.DirectionalLight(0xffffff, 3);

directionalLight.position.set(5, 10, 7);

scene.add(directionalLight);



const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 50),
  new THREE.MeshStandardMaterial({
    color: 0x444444
  })
);

ground.rotation.x = -Math.PI / 2;

scene.add(ground);



const loader = new GLTFLoader();

let carModel;

loader.load(

  'car.glb',

  (gltf) => {

    console.log("MODEL LOADED");

    carModel = gltf.scene;

    carModel.scale.set(1,1,1);

    scene.add(carModel);

  },

  undefined,

  (error) => {

    console.error(error);

  }

);

const uploadInput = document.getElementById('textureUpload');

const textureLoader = new THREE.TextureLoader();

uploadInput.addEventListener('change', (event) => {

  const file = event.target.files[0];

  if (!file || !carModel) return;

  const imageURL = URL.createObjectURL(file);

  textureLoader.load(imageURL, (texture) => {

    texture.flipY = false;

    carModel.traverse((child) => {

      if (child.isMesh) {

        child.material.map = texture;

        child.material.needsUpdate = true;

      }

    });

  });

});



window.addEventListener('resize', () => {

  camera.aspect = window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);

});


const keys = {};

window.addEventListener('keydown', (event) => {

  keys[event.key.toLowerCase()] = true;

});

window.addEventListener('keyup', (event) => {

  keys[event.key.toLowerCase()] = false;

});

let speed = 0;
  
function animate() {

  requestAnimationFrame(animate);

  if (carModel) {

    // FORWARD / BACKWARD

    if (keys['w']) {
      speed = 0.05;
    }
    else if (keys['s']) {
      speed = -0.05;
    }
    else {
      speed = 0;
    }



    // TURNING

    if (keys['a']) {
      carModel.rotation.y += 0.03;
    }

    if (keys['d']) {
      carModel.rotation.y -= 0.03;
    }



    // MOVE IN DIRECTION CAR IS FACING

    carModel.translateZ(-speed);

  }

  renderer.render(scene, camera);

}

animate();

</script>

</body>
</html>
